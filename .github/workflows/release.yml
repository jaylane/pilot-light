name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: claude plugin test .
      # Installs read the version from plugin.json, so a tag that disagrees
      # with it would publish release notes for a version nobody can install.
      - name: Tag matches plugin.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(jq -r .version .claude-plugin/plugin.json)"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match plugin.json version $version" >&2
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Pilot Light $GITHUB_REF_NAME" --generate-notes
